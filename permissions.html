<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CallLog Microphone Access</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0e0e11;
      color: #e8e8ec;
      font-family: Inter, system-ui, sans-serif;
    }
    main {
      width: min(440px, calc(100vw - 32px));
      border: 1px solid #23232d;
      border-radius: 8px;
      background: #14141a;
      padding: 22px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 18px;
      line-height: 1.25;
      font-weight: 650;
    }
    p {
      margin: 0 0 16px;
      color: #9a9aa5;
      font-size: 13px;
      line-height: 1.55;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 11px 14px;
      background: #4ade80;
      color: #071510;
      cursor: pointer;
      font: inherit;
      font-weight: 650;
    }
    button:hover { background: #86efac; }
    .status {
      min-height: 20px;
      margin-top: 14px;
      color: #9a9aa5;
      font-size: 12px;
      line-height: 1.5;
      word-break: break-word;
    }
    .status.error { color: #f87171; }
    .status.ok { color: #4ade80; }
    code {
      display: block;
      margin-top: 10px;
      padding: 8px;
      border: 1px solid #2a2a38;
      border-radius: 6px;
      background: #0b0b10;
      color: #d4d4da;
      user-select: all;
    }
  </style>
</head>
<body>
  <main>
    <h1>Allow microphone access</h1>
    <p>CallLog needs Chrome microphone permission to record your side of sales calls. Chrome will show its permission prompt from this extension page.</p>
    <button id="request-mic">Allow Microphone</button>
    <div id="status" class="status">Waiting for Chrome permission prompt...</div>
  </main>
  <script src="permissions.js"></script>
</body>
</html>
