name: Build release image

on:
  workflow_dispatch:

concurrency:
  group: release-image
  cancel-in-progress: false

permissions:
  artifact-metadata: write
  attestations: write
  contents: read
  id-token: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/nbleicher/cauli

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out accepted main
        uses: actions/checkout@v7.0.0

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Recheck release source
        run: |
          npm ci
          npm audit --omit=dev
          npm run check:release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Authenticate to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish the immutable image
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
          provenance: mode=max

      - name: Produce the SPDX SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: release-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Scan the runtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: json
          output: release-trivy.json
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Enforce vulnerability policy and expiring exceptions
        run: node scripts/release/vulnerability-gate.mjs release-trivy.json

      - name: Attest build provenance
        uses: actions/attest@v4.2.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest the SBOM
        uses: actions/attest@v4.2.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: release-sbom.spdx.json
          push-to-registry: true

      - name: Record the release manifest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg digest "$IMAGE_DIGEST" \
            --arg image "$IMAGE_NAME" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{commit: $commit, image: $image, digest: $digest, build_run: $run}' \
            > release-manifest.json

      - name: Upload immutable release evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ github.sha }}
          path: |
            release-manifest.json
            release-sbom.spdx.json
            release-trivy.json
          if-no-files-found: error
          retention-days: 90
