name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan complete Git history for secrets
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 \
            detect --source=/repo --no-banner --redact --verbose

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.0

      - name: Start local Supabase and apply migrations
        run: |
          supabase start
          supabase db reset
          while IFS='=' read -r name value; do
            value="${value#\"}"
            value="${value%\"}"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done < <(supabase status -o env)

      - name: Install Chrome
        run: npx playwright install --with-deps chromium

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Public-source and regulated-claim checks
        run: npm run check:release

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and worker integration tests
        env:
          RUN_DATABASE_INTEGRATION: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SECRET_KEY }}
          OPENROUTER_API_KEY: integration-test-key
        run: npm test

      - name: Chrome browser tests
        env:
          RUN_DATABASE_INTEGRATION: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SECRET_KEY }}
          APP_URL: http://127.0.0.1:3102
        run: npm run test:e2e -w @calllog/web

      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SECRET_KEY }}
          OPENROUTER_API_KEY: build-placeholder
        run: npm run build
