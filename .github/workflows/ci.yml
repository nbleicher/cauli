name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan complete Git history for secrets
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 \
            detect --source=/repo --no-banner --redact --verbose

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.110.0

      - name: Start local Supabase and apply migrations
        run: |
          supabase start
          supabase db reset
          while IFS='=' read -r name value; do
            value="${value#\"}"
            value="${value%\"}"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
            export "$name=$value"
          done < <(supabase status -o env)
          for attempt in $(seq 1 30); do
            status="$(
              curl --silent --output /dev/null --write-out '%{http_code}' \
                "$API_URL/auth/v1/health" ||
                true
            )"
            if [ "$status" = "200" ]; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo "Supabase Auth did not become ready after database reset"
              exit 1
            fi
            sleep 1
          done

      - name: Install Chrome
        run: npx playwright install --with-deps chromium

      # The offline Source Audio Backup recovery path is proven against the
      # official tool an operator would actually use, not a reimplementation.
      - name: Install age
        run: sudo apt-get update && sudo apt-get install --yes age

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Public-source and regulated-claim checks
        run: npm run check:release

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and worker integration tests
        env:
          RUN_DATABASE_INTEGRATION: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SECRET_KEY }}
          OPENROUTER_API_KEY: integration-test-key
        run: npm test

      - name: Chrome browser tests
        env:
          RUN_DATABASE_INTEGRATION: "1"
          RUN_IDENTITY_INTEGRATION: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SECRET_KEY }}
          APP_URL: http://127.0.0.1:3102
          MAILPIT_URL: http://127.0.0.1:54324
        run: |
          supabase functions serve identity-admin \
            --env-file supabase/functions/identity-admin/test.env \
            > "$RUNNER_TEMP/identity-admin.log" 2>&1 &
          identity_pid="$!"
          trap 'kill "$identity_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            status="$(
              curl --silent --output /dev/null --write-out '%{http_code}' \
                --request POST \
                --header "Authorization: Bearer $ANON_KEY" \
                --header "apikey: $ANON_KEY" \
                --header "Content-Type: application/json" \
                --data '{"action":"unsupported"}' \
                "$API_URL/functions/v1/identity-admin" ||
                true
            )"
            if [ "$status" = "400" ]; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              cat "$RUNNER_TEMP/identity-admin.log"
              exit 1
            fi
            sleep 1
          done
          npm run test:e2e -w @calllog/web

      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SECRET_KEY }}
          OPENROUTER_API_KEY: build-placeholder
        run: npm run build
