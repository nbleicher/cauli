[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["apps/web/**", "apps/worker/**", "packages/shared/**", "Dockerfile", "package.json", "package-lock.json", "tsconfig.base.json"]

[deploy]
startCommand = "node apps/worker/dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
multiRegionConfig = { "us-east4-eqdc4a" = { numReplicas = 1 } }
